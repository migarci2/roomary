<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roomary project thumbnail</title>
  <style>
    @font-face {
      font-family: "Schoolbell";
      src: url("fonts/Schoolbell-Regular.ttf") format("truetype");
      font-display: block;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #fff; }

    #thumbnail {
      position: relative;
      width: 1500px;
      height: 1000px;
      overflow: hidden;
      color: #111;
      background: #fff;
      font-family: "Schoolbell", "Comic Neue", cursive;
    }

    .copy {
      position: absolute;
      top: 320px;
      left: 84px;
      z-index: 4;
      width: 720px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 27px;
      color: #111;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: .16em;
    }

    .eyebrow::before {
      width: 52px;
      height: 1px;
      background: #111;
      content: "";
    }

    h1 {
      margin: 0;
      font-family: "Schoolbell", "Comic Neue", cursive;
      font-size: 168px;
      font-weight: 400;
      letter-spacing: .01em;
      line-height: .9;
    }

    .tagline {
      width: 610px;
      margin: 30px 0 0 7px;
      color: #111;
      font-family: "Schoolbell", "Comic Neue", cursive;
      font-size: 43px;
      line-height: 1.28;
    }

    .tagline strong {
      padding: 0 .13em;
      color: #fff;
      background: #111;
      border-radius: 3px;
      font-weight: 400;
    }

    .room {
      position: absolute;
      top: 110px;
      right: -15px;
      z-index: 3;
      width: 780px;
      height: 780px;
      object-fit: contain;
    }

  </style>
</head>
<body>
  <main id="thumbnail" aria-label="Roomary thumbnail: writing becomes a 3D room">
    <section class="copy">
      <div class="eyebrow">A SPATIAL MEMORY FOR WRITERS</div>
      <h1>Roomary</h1>
      <p class="tagline">Turn <strong>written rooms</strong> into <strong>places</strong> you can return to.</p>
    </section>

    <img class="room" src="room-diorama-doodle.png" alt="A hand-drawn black-and-white bedroom doodle">
  </main>
</body>
</html>
